
name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portifolio/package-lock.json

      - name: Install dependencies
        working-directory: portifolio
        run: npm ci

      - name: Atualizar lista de projetos
        working-directory: portifolio
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-projects.mjs

      # Instalar navegador para capturar as interfaces
      - name: Instalar Chromium para previews
        working-directory: portifolio
        run: npx playwright install --with-deps chromium

      # Gerar miniaturas reais dos projetos
      - name: Gerar miniaturas dos projetos
        working-directory: portifolio
        run: node scripts/generate-previews.mjs

      # Compilar o portfólio com as miniaturas
      - name: Build website
        working-directory: portifolio
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: portifolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
